[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "Control-plane engineering skeleton for RSNA Knee 2026 (Mac code / Kaggle data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sarasa AI" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17"]
kaggle = [
  "torch>=2.2",
  "torchvision>=0.17",
  "pydicom>=2.4",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.0",
]
dev = [
  "pytest>=7.4,<9",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: optional longer imaging smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
